name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck shfmt bats jq openssl
      - name: Single-file release is up to date
        run: make build-check
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test

  e2e:
    name: End to end (${{ matrix.core }}, ${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        core: [xray, sing-box]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy a node and push traffic through it
        run: sudo bash tests/e2e/run.sh ${{ matrix.core }}
